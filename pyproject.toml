[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioconverters"
version = "2.0.0"
description = "Convert between NCBI pubmed/PMC and BIOC formats"
readme = "README.md"
license = { text = "MIT" }
authors = [
	{ name = "Jake Lever", email = "jake.lever@gmail.com" },
]
keywords = ["pubmed", "pmc", "bioc", "xml"]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = ["bioc>=2.0", "spans_and_trees>=0.3.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "requests"]
lint = ["ruff"]

[project.urls]
Homepage = "https://github.com/jakelever/bioconverters"

[tool.setuptools]
packages = ["bioconverters"]

[tool.ruff]
indent-width = 4
target-version = "py38"
line-length = 220

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
